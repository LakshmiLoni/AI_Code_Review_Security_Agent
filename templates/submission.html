```html
{% extends "base.html" %}
{% set active_page = "submit" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-10">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0" style="color: var(--text-dark);">
        Submit Source Code for Review
      </h4>

      <div id="detectedLangBadge" class="badge badge-orange px-3 py-2 fs-6">
        Language: Auto-Detect
      </div>
    </div>

    <!-- Submission Form -->
    <div class="card">

      <div class="card-header bg-white">
        <ul class="nav nav-tabs card-header-tabs" id="submitTabs" role="tablist">

          <li class="nav-item">
            <button class="nav-link active"
                    id="paste-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#pastePane"
                    type="button"
                    role="tab">
              <i class="bi bi-clipboard me-1" style="color: var(--primary);"></i>
              Paste Source Code
            </button>
          </li>

          <li class="nav-item">
            <button class="nav-link"
                    id="upload-tab"
                    data-bs-toggle="tab"
                    data-bs-target="#uploadPane"
                    type="button"
                    role="tab">
              <i class="bi bi-cloud-arrow-up me-1" style="color: var(--primary);"></i>
              Upload File (.py, .java)
            </button>
          </li>

        </ul>
      </div>

      <div class="card-body p-4">
        <div class="tab-content" id="submitTabsContent">

          <!-- Paste Code -->
          <div class="tab-pane fade show active" id="pastePane" role="tabpanel">

            <form action="{{ url_for('submit') }}" method="POST">
              <input type="hidden" name="submission_type" value="paste">

              <div class="mb-3">
                <label for="codeEditor"
                       class="form-label fw-bold small text-uppercase"
                       style="color: var(--text-dark);">
                  Source Code Editor
                </label>

                <textarea
                  class="form-control font-monospace"
                  id="codeEditor"
                  name="code_content"
                  rows="14"
                  placeholder="Paste Python or Java code here..."
                  style="font-size: 0.88rem; line-height: 1.45; resize: vertical; border-color: var(--border-color);"
                  required
                ></textarea>
              </div>

              <div class="d-flex justify-content-between align-items-center">
                

                <button type="submit" class="btn btn-primary px-4 py-2 shadow-sm">
                  <i class="bi bi-search me-1"></i>
                  Analyze Code
                </button>
              </div>

            </form>
          </div>

          <!-- Upload File -->
          <div class="tab-pane fade" id="uploadPane" role="tabpanel">

            <form action="{{ url_for('submit') }}"
                  method="POST"
                  enctype="multipart/form-data">

              <input type="hidden" name="submission_type" value="upload">

              <div class="p-5 border-2 border-dashed rounded text-center mb-3"
                   style="background-color: var(--bg-subtle); border-color: var(--border-color) !important;">

                <i class="bi bi-cloud-upload mb-3"
                   style="font-size: 3rem; color: var(--primary);"></i>

                <h5 style="color: var(--text-dark);">
                  Select Python (.py) or Java (.java) file
                </h5>

                <p class="small mb-3" style="color: var(--text-secondary);">
                  Maximum file size: 5 MB
                </p>

                <input
                  class="form-control w-50 mx-auto"
                  type="file"
                  id="codeFileInput"
                  name="code_file"
                  accept=".py,.java"
                  required
                >

                <div id="fileNameDisplay"
                     class="mt-2 fw-bold small"
                     style="color: var(--primary-dark);">
                </div>

              </div>

              <div class="d-flex justify-content-between align-items-center">

                <span class="small" style="color: var(--text-secondary);">
                  <i class="bi bi-info-circle me-1" style="color: var(--primary);"></i>
                  Automatically determines language from file extension.
                </span>

                <button type="submit" class="btn btn-primary px-4 py-2 shadow-sm">
                  <i class="bi bi-upload me-1"></i>
                  Upload &amp; Review
                </button>

              </div>

            </form>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
```
