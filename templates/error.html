{% extends "base.html" %}

{% block title %}Error {{ error_code }} - SentinelAI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 3rem auto; text-align: center;">
  <div class="card card-gold-accent" style="padding: 2.5rem 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: #b91c1c;">
      Error {{ error_code }}
    </h1>
    <p style="font-size: 1.05rem; color: var(--text-muted); margin-bottom: 1.5rem;">
      {{ message }}
    </p>
    <div style="display: flex; justify-content: center; gap: 1rem;">
      <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Go to Home</a>
      <a href="{{ url_for('reviews.new_review') }}" class="btn btn-primary">Start New Review</a>
    </div>
  </div>
</div>
{% endblock %}
